databaseChangeLog:

  - changeSet:
      id: "003-create-leave-requests"
      author: "mohith"

      changes:

        - createTable:
            tableName: "leave_requests"

            columns:

              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: "employee_id"
                  type: "BIGINT"
                  constraints:
                    nullable: false

              - column:
                  name: "start_date"
                  type: "DATE"

              - column:
                  name: "end_date"
                  type: "DATE"

              - column:
                  name: "reason"
                  type: "VARCHAR(255)"

              - column:
                  name: "status"
                  type: "VARCHAR(50)"

        - addForeignKeyConstraint:
            baseTableName: "leave_requests"
            baseColumnNames: "employee_id"
            referencedTableName: "employees"
            referencedColumnNames: "id"
            constraintName: "fk_leave_request_employee"