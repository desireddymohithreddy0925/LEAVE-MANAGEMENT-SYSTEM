spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/leave_management_test_pg
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: secret
    hikari:
      maximum-pool-size: 25
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: test

app:
  jwt:
    secret: ${JWT_SECRET:testOnlySecretKeyForUnitAndIntegrationTestsThatIsAtLeast32BytesLong!}
  security:
    encryption:
      key: ${ENCRYPTION_KEY:testOnlyMasterEncryptionKeyForUnitAndIntegrationTests256Bit!}

jwt:
  secret: ${JWT_SECRET:testOnlySecretKeyForUnitAndIntegrationTestsThatIsAtLeast32BytesLong!}

