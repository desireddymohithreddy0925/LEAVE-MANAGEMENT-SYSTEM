# ==============================================================================
# Leave Management System - Test Environment Profile ('test')
# ==============================================================================
# Fast in-memory H2 configuration for automated unit and integration tests.
# ==============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR;DEFAULT_LOCK_TIMEOUT=15000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 25
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: test

logging:
  level:
    root: WARN
    com.leave_management_system: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET:testOnlySecretKeyForUnitAndIntegrationTestsThatIsAtLeast32BytesLong!}
  security:
    encryption:
      key: ${ENCRYPTION_KEY:testOnlyMasterEncryptionKeyForUnitAndIntegrationTests256Bit!}

jwt:
  secret: ${JWT_SECRET:testOnlySecretKeyForUnitAndIntegrationTestsThatIsAtLeast32BytesLong!}

