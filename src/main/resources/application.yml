spring:
  application:
    name: leave-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Common JWT configuration defaults (can be overridden in environments)
app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyThatNeedsToBeVeryLongAndSecureEnoughForHS256AlgorithmToBeUsedSafelyAndSecurely}
    expirationMs: ${JWT_EXPIRATION:900000}
    refreshExpirationMs: ${JWT_REFRESH_EXPIRATION:604800000}

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatNeedsToBeVeryLongAndSecureEnoughForHS256AlgorithmToBeUsedSafelyAndSecurely}
  expirationMs: ${JWT_EXPIRATION:900000}
  refreshExpirationMs: ${JWT_REFRESH_EXPIRATION:604800000}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      name: Leave Management System
      description: API for managing employee leaves
      version: 1.0.0
