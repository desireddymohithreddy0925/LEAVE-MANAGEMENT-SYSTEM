spring.application.name=leave-management-system
debug=true

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/leave_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate to automatically create/update tables based on your JPA entities.

# JWT Authentication Security
# Refresh tokens are revoked immediately upon password change or account deactivation.
# Stateless access JWT validity window is strictly limited to 15 minutes (900,000 ms).
app.jwt.expirationMs=900000
