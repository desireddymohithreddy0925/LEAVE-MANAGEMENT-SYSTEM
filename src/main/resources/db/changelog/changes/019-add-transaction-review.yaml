databaseChangeLog:
  - changeSet:
      id: 019-add-transaction-review
      author: antigravity
      changes:
        - createTable:
            tableName: transaction_reviews
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: employee_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_tx_review_employee
                    references: employees(id)
                    deleteCascade: true
                    nullable: true
              - column:
                  name: actor_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_tx_review_actor
                    references: users(id)
                    deleteCascade: true
                    nullable: true
              - column:
                  name: actor_email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: risk_level
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: risk_score
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: risk_reason
                  type: varchar(500)
              - column:
                  name: review_status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: reviewer_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_tx_review_reviewer
                    references: users(id)
                    deleteCascade: true
                    nullable: true
              - column:
                  name: reviewer_email
                  type: varchar(255)
              - column:
                  name: review_notes
                  type: varchar(2000)
              - column:
                  name: resolution
                  type: varchar(100)
              - column:
                  name: details_json
                  type: varchar(4000)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: reviewed_at
                  type: timestamp

        - createIndex:
            indexName: idx_tx_review_type
            tableName: transaction_reviews
            columns:
              - column:
                  name: transaction_type
        - createIndex:
            indexName: idx_tx_review_status
            tableName: transaction_reviews
            columns:
              - column:
                  name: review_status
        - createIndex:
            indexName: idx_tx_review_risk_level
            tableName: transaction_reviews
            columns:
              - column:
                  name: risk_level
        - createIndex:
            indexName: idx_tx_review_emp_id
            tableName: transaction_reviews
            columns:
              - column:
                  name: employee_id
        - createIndex:
            indexName: idx_tx_review_actor_id
            tableName: transaction_reviews
            columns:
              - column:
                  name: actor_id
        - createIndex:
            indexName: idx_tx_review_reviewer_id
            tableName: transaction_reviews
            columns:
              - column:
                  name: reviewer_id
        - createIndex:
            indexName: idx_tx_review_created_at
            tableName: transaction_reviews
            columns:
              - column:
                  name: created_at
