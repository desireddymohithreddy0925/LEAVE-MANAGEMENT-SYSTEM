databaseChangeLog:
  - changeSet:
      id: 004-create-leave-types
      author: mohith
      changes:
        - createTable:
            tableName: leave_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: description
                  type: VARCHAR(500)

              - column:
                  name: default_days
                  type: INT
                  constraints:
                    nullable: false
