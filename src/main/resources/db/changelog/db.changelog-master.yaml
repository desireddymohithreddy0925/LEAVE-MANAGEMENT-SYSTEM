databaseChangeLog:
  - changeSet:
      id: 1
      author: antigravity
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: phone
                  type: varchar(255)
              - column:
                  name: active
                  type: bit(1)
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_employee_department
                    references: departments(id)
        - createTable:
            tableName: leave_requests
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leave_request_employee
                    references: employees(id)
              - column:
                  name: start_date
                  type: date
              - column:
                  name: end_date
                  type: date
              - column:
                  name: reason
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(255)
  - changeSet:
      id: 2
      author: antigravity
      changes:
        - dropColumn:
            tableName: employees
            columnName: name
        - addColumn:
            tableName: employees
            columns:
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)

  - include:
      file: changes/004-create-leave-types.yaml
      relativeToChangelogFile: true

  - include:
      file: changes/005-create-leave-balances.yaml
      relativeToChangelogFile: true

  - include:
      file: changes/006-update-leave-requests.yaml
      relativeToChangelogFile: true

  - include:
      file: db/changelog/changes/007-add-active-to-leave-types.yaml
  - include:
      file: db/changelog/changes/008-add-rejection-reason-to-leave-requests.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/009-add-missing-constraints.yaml
      relativeToChangelogFile: true
